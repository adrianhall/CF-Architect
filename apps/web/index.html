<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CF-Architect — visual architecture design for Cloudflare" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CF-Architect</title>

    <!--
      No-FOUC theme script.
      Runs synchronously before React hydrates to set the correct theme on <html>
      without a flash of unstyled content. Reads from localStorage; falls back to
      the OS preference via prefers-color-scheme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "dark" || stored === "light" || stored === "high-contrast") {
            document.documentElement.setAttribute("data-theme", stored);
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (_) {
          // localStorage may be unavailable in some environments; fail silently.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
