name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# ---------------------------------------------------------------------------
# TODO (Phase 01 follow-up — before first production deploy):
#   1. Decide which Cloudflare account to use for CI deployments.
#      Recommendation: a dedicated sub-account with a narrow API token scoped
#      to Workers Scripts:Edit only (separate from the provisioning token).
#   2. Create the following GitHub repository secrets:
#      - CLOUDFLARE_ACCOUNT_ID   — the target Cloudflare account ID
#      - CLOUDFLARE_API_TOKEN    — Workers Scripts:Edit-scoped deploy token
#   3. Remove this comment block once both secrets are set.
# ---------------------------------------------------------------------------

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native deps (postinstall allowlist)
        run: node scripts/postinstall.mjs

      # ---------------------------------------------------------------------------
      # Run all CI checks before deploying
      # ---------------------------------------------------------------------------
      - name: Type-check
        run: npm run check:types

      - name: Lint
        run: npm run check:lint

      - name: Format check
        run: npm run check:format

      - name: Audit
        run: npm audit --audit-level=high && npm audit signatures

      - name: Unit tests + coverage
        run: npm run test:ci

      - name: Build
        run: npm run build

      # ---------------------------------------------------------------------------
      # Deploy — requires wrangler.jsonc to exist (generated by render-wrangler
      # after provision, or provided as a CI secret file / env substitution)
      # ---------------------------------------------------------------------------
      - name: Apply migrations
        run: npm run migrate -- --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ---------------------------------------------------------------------------
      # Provenance evidence — record the lockfile checksum for each deploy
      # ---------------------------------------------------------------------------
      - name: Record lockfile checksum
        run: |
          echo "package-lock.json sha256: $(sha256sum package-lock.json | cut -d' ' -f1)"
